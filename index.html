<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To the Power of Math!</title>
  <style>
    h1 {
      color: #FFFFFF;
      font-family: system-ui;
      margin-left: 20px;
    }
    body {
      background-color: #222629;
    }
    label {
      color: #86C232;
      font-family: system-ui;
      font-size: 20px;
      margin-left: 20px;
      margin-top: 20px;
    }
    button {
      background-color: #86C232;
      border-color: #86C232;
      color: #FFFFFF;
      font-family: system-ui;
      font-size: 20px;
      font-weight: bold;
      margin-left: 30px;
      margin-top: 20px;
      width: 140px;
    }
    input {
      color: #222629;
      font-family: system-ui;
      font-size: 20px;
      margin-left: 10px;
      margin-top: 20px;
      width: 100px;
    }
  </style>
  <script>
    // This is the API Gateway URL documented in the working tutorial project.
    // Replace it with your own API Gateway invoke URL when deploying in a new AWS account.
    var callAPI = (base, exponent) => {
      var myHeaders = new Headers();
      myHeaders.append("Content-Type", "application/json");
      var raw = JSON.stringify({"base": base, "exponent": exponent});
      var requestOptions = {
        method: 'POST',
        headers: myHeaders,
        body: raw,
        redirect: 'follow'
      };
      fetch("https://pievpbobq4.execute-api.us-east-1.amazonaws.com/dev", requestOptions)
        .then(response => response.json())
        .then(result => alert("Result: " + result))
        .catch(error => console.log('error', error));
    };
  </script>
</head>
<body>
  <h1>TO THE POWER OF MATH!</h1>
  <form>
    <label for="base">Base number:</label>
    <input type="text" id="base">
    <label for="exponent">...to the power of:</label>
    <input type="text" id="exponent">
    <button type="button" onclick="callAPI(document.getElementById('base').value, document.getElementById('exponent').value)">CALCULATE</button>
  </form>
</body>
</html>
